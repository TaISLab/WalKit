# Correccion del eje temporal del mocap (rigid_bodies) respecto al del robot, por bag.
# El reloj del PC del mocap y el del andador no estan sincronizados: en estos bags el desfase vale `offset_s` en
# t_ref y deriva `slope` s por s (p.ej. -0.066 = 6.6 s cada 100 s; un error de escala de tiempo de hasta ~7 %).
# Sin corregirlo la guinada del mocap se ve con correlacion 0.5-0.8 respecto al gyro y parece "mocap malo".
#
#   t_robot = t_mocap + offset_s + slope * (t_mocap - t_ref)       (segundos, sellos de cabecera)
#
# Se ajusta por bag maximizando la correlacion entre la velocidad de guinada del mocap y el gyro crudo
# (gyro_check.py / fit_time_warp.py). Solo se aplica si mejora la correlacion >0.01 y el efecto es apreciable.
# Tras corregir, la correlacion pasa de 0.54-0.84 a 0.993-0.997 en los 6 bags antes "sospechosos".
CA_test02:
  corr_after: 0.996
  corr_before: 0.97
  offset_s: -0.21
  slope: 0.002
  t_ref: 1719399688.245
