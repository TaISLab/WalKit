# Calidad de los bags definitivos (bagsFolder/definitive) para evaluar odometria contra el mocap.
# Los generan/verifican diagnose_bags.py (taxonomia) y gyro_check.py (signo/sesgo del gyro).
# Todos los scripts de odom_tuning leen ESTE fichero: un bag apartado aqui queda fuera de la puntuacion
# ("limpios" = todos los demas), aunque sigue disponible con --bags scan_anom | mocap_suspect | all.
#
# Criterio (ver diagnose_bags.py): con el gyro crudo como arbitro entre laser y mocap,
#   - el laser discrepa de AMBOS (gyro y mocap coinciden entre si)  -> scan_matching_anomalous
#   - el mocap discrepa de AMBOS (gyro y laser coinciden entre si)  -> mocap_suspect
# Cifras de 2026-10: "cum l-m"/"cum g-m" = rms del yaw acumulado laser-mocap / gyro-mocap en grados;
# "corr g-m" = correlacion de la velocidad de guinada gyro-mocap.

scan_matching_anomalous:   # el scan matching deriva en rumbo; el gyro y el mocap tienen razon
  MF_test20: "cum l-m 46 deg vs g-m 0.7; deriva 8.1 %; ademas 24 deg de sesgo constante de rumbo. El peor"
  MF_test19: "cum l-m 36 deg vs g-m 2.3; 1395 deg de giro total"
  CA_test03: "cum l-m 23 deg vs g-m 3.5"
  CA_test09: "cum l-m 26 deg vs g-m 3.3; 924 deg de giro total"
  LA_test01:  "cum l-m 12 deg vs g-m 1.7; deriva 4.75 %; 12.7 deg de sesgo constante"
  LA_test07:  "velocidad de guinada laser-mocap rms 10.8 deg/s (corr 0.76) frente a 0.8 (corr 1.00) del gyro; salto puntual de heading"
  MF_test05: "cum l-m 11 deg vs g-m 5.6 (moderado); 1170 deg de giro total"
  MF_test06: "cum l-m 17 deg vs g-m 2.7 (el laser se aleja ~17 deg tanto del gyro como del mocap). ADEMAS tiene un salto
              real de orientacion del mocap (~1.8e5 deg/s) que infla el giro total a 2129 deg y contamina las
              velocidades (por eso diagnose_bags.py lo ve tambien como mocap dudoso)"

mocap_suspect:             # (vacio) la guinada del mocap no cuadra con gyro ni laser, que coinciden entre si
  # Los 6 bags que estaban aqui (MT_test12-15, CA_test05, CA_test06) tienen el eje temporal del mocap desplazado y/o
  # escalado respecto a gyro y laser (offset de hasta 5 s y deriva de hasta 7 %); la guinada del mocap es correcta
  # una vez corregido ese eje con time_warp.yaml, no era un cuerpo rigido mal definido. La CAUSA no esta identificada
  # (los sellos de cabecera no muestran ningun reloj desfasado; ver la cabecera de time_warp.yaml). diagnose_bags.py
  # sigue clasificando como mocap_suspect un bag cuyo desajuste no este en time_warp.yaml (fit_time_warp.py lo
  # calcula). MT_test15 pasa a "limpios"; los otros cinco ver imu_gyro_scale.

imu_gyro_scale:            # mocap OK (con time_warp.yaml) y laser OK, pero la integral del gyro NO cuadra
  # Cociente (guinada integrada del gyro) / (guinada del laser), en valor absoluto, medido en ventanas de 30 s
  # con >= 150 deg de giro. En los 38 bags restantes 0.948-1.036; aqui 0.93-1.06 y estable durante todo el bag,
  # asi que es una ESCALA del gyro distinta en esas sesiones, no ruido (el laser coincide con el mocap <1.5 %).
  # Con ello el EKF de produccion empeora respecto al scan matcher solo (CA_test05: 6.2 vs 3.1 deg).
  # Causa sin identificar: en estas sesiones el IMU llega a 60-80 msg/s (mediana de dt 93-106 Hz => huecos).
  CA_test05: "gyro/laser 0.932; EKF 6.24 deg vs laser 3.06"
  CA_test06: "gyro/laser 1.060; EKF 5.66 deg vs laser 2.19"
  MT_test12: "gyro/laser 0.934; EKF 2.80 deg vs laser 2.68 (casi neutro)"
  MT_test13: "gyro/laser 0.948; EKF 6.46 deg vs laser 4.08"
  MT_test14: "gyro/laser 1.037; EKF 4.82 deg vs laser 2.57"

no_imu:                    # sin mensajes /bwt901cl/imu (solo un imu_filtered con 0 mensajes)
  MT_test11: "no hay IMU; ademas rumbo laser-mocap 31 deg"

notes:
  - "Revision de los 14 bags apartados (2026-10): los 6 mocap_suspect eran un desajuste temporal del mocap (time_warp.yaml, causa sin identificar); 5 de ellos tienen ademas una escala de gyro distinta (imu_gyro_scale) y MT_test15 queda limpio. Los 8 scan_matching_anomalous se confirman: ninguna firma en estadisticas de escena (puntos validos, rango, planitud); lo que los distingue es MAS giro, mas giro en el sitio y giros rapidos (saltos de rumbo con rotacion moderada y poca velocidad lineal)."
  - "CA_test02 y CA_test07 son scan matching limite de verdad: NO se explican por el desajuste temporal del mocap (time_warp.yaml les aplica un ajuste pequeno que no cambia el diagnostico)."
  - "Las etiquetas de scan_matching_anomalous describen el scan matcher SIN el prior del gyro en el ICP; con el prior (ya activo en walker_lsm.yaml) esos bags bajan de 13.9 a 5.9 deg de media, pero se mantienen apartados para que la puntuacion de los limpios no mezcle regimenes."
  - "Casos limite que se MANTIENEN como limpios aunque diagnose_bags.py los marca: CA_test02 (cum l-m 12 vs g-m 5.8) y CA_test07 (10.6 vs 2.5)."
  - "MF_test07: la guinada del mocap es ruidosa (0.94 deg de ruido, 8 saltos >5 deg) pero el gyro y el laser la siguen; se mantiene como limpio."
  - "Cortes del mocap de hasta ~0.5 s en MF_test20, MF_test09, MF_test12, MF_test07 (rigid body perdido)."
  - "Hay muestras del mocap con sello temporal duplicado (dt ~ 0): inofensivo, pero cualquier derivada debe ignorar dt < 5 ms."
  - "Los 'saltos' de cientos de m/s que da una velocidad naive del mocap son ese artefacto, no poses erroneas."
