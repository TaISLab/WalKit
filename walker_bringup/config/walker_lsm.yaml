laser_scan_matcher_node:
  ros__parameters:
    # NOTE: this file used to also carry a block of robot_localization
    # navsat_transform_node parameters (frequency, delay,
    # magnetic_declination_radians, yaw_offset, zero_altitude,
    # broadcast_utm_transform, publish_filtered_gps, use_odometry_yaw,
    # wait_for_datum) left over from some earlier copy-paste. laser_scan_matcher
    # (ros2_laser_scan_matcher/src/laser_scan_matcher.cpp) never declares or
    # reads any of them -- there's no GPS on this robot -- so they were dead,
    # confusing config. Removed; see pose/twist covariance below for the
    # params that actually matter for this node's contribution to the EKF.
    publish_odom: /scan_odom         # odometry topic name from laser_scan. Empty if not publishing
    publish_tf: false                 # true if publish tf odom_frame - base_frame
    invert_tf: false                  # true if published tf is base_frame -> odom_frame instead of odom_frame -> base_frame
    base_frame: base_footprint       # robot base frame
    # This MUST be a frame that either equals the EKF's world_frame ("odom",
    # see walker_ekf.yaml) or is connected to it via TF. It used to be the
    # made-up name "scan_odom", which is never published anywhere in the TF
    # tree -- robot_localization's preparePose() requires a TF path from a
    # pose measurement's frame_id to its own world_frame before it will fuse
    # ANY of that measurement's position or orientation (ros_filter.cpp:
    # lookupTransformSafe() only self-transforms via an identity fallback
    # when target_frame == source_frame; "scan_odom" != "odom" and nothing
    # ever bridges them, so that lookup always failed and preparePose()
    # returned false -- see its `if (can_transform) {...} else { retVal =
    # false; }` branch). The pose fusion (x, y, yaw) was therefore silently
    # dropped on every single message; only this message's twist (vx, vy),
    # which uses child_frame_id="base_footprint" and needs no transform,
    # ever reached the filter. That looked deceptively OK on a straight-line
    # walk (yaw frozen at its initial value, so unrotated body-frame
    # velocity still summed into a roughly-correct path) but produced total
    # heading garbage (validated: >100 deg yaw RMSE against mocap) as soon
    # as the walker actually turned. Using "odom" here makes source_frame ==
    # target_frame, so the identity fallback always succeeds immediately,
    # with no dependency on TF broadcast order at startup.
    odom_frame: odom                 # odom frame
    map_frame: map                   # map frame
    laser_scan_frame: laser          # laser frame
    laser_scan_topic: /scan_nav      # Which topic to subscribe for the laser_scan
    kf_dist_linear: 0.10             #  When to generate keyframe scan
    kf_dist_angular: 0.087           # (~5.0º) When to generate keyframe scan
    # Gyro prior for the ICP initial guess (see ros2_laser_scan_matcher README). RAW gyro, not
    # imu_filtered. Needs base_footprint->witmotion in TF (z axis up, no 180 deg roll).
    imu_topic: /bwt901cl/imu
    imu_prior_max_rate: 10.0
    imu_prior_max_gap: 0.1
    imu_prior_residual_max_deg: 15.0
    # Also run the ICP WITHOUT the gyro seed; take it only if it fits clearly better (mean error < 0.7x).
    # This is what makes a wrong-sign or faulty gyro harmless instead of worse than no prior.
    imu_prior_arbitration_ratio: 0.7
    imu_prior_disable_s: 2.0
    # The RPLidar sweep takes ~0.157 s (/scan scan_time) and the scan is stamped at its START,
    # but the matched pose describes the robot about mid-sweep. Stamping the odometry half a
    # sweep later keeps it consistent with the gyro in the EKF (ns added to the Odometry stamp).
    odom_time_offset_ns: 80000000

    # Fixed diagonal covariance published on /scan_odom (x, y, z, roll, pitch,
    # yaw / vx, vy, vz, vroll, vpitch, vyaw) -- CSM's do_compute_covariance is
    # off (expensive per-scan), so this fixed estimate is what
    # robot_localization (walker_ekf.yaml, odom0) actually weights this
    # sensor by. Starting point only: re-tune from the ATE numbers produced
    # by mocap_odometry/scripts/eval_odom_against_mocap.py against the
    # mocap-labeled bags in bagsFolder_unified before trusting these values
    # in the field.
    # Heading variance 0.2 rad2 (std ~26 deg): deliberately weak. Successive scan matches are chained to
    # one keyframe, so they are not independent heading measurements, and since the gyro also seeds
    # the ICP (imu_topic below) the heading is dominated by the gyro and the laser only anchors it
    # slowly. Measured against the mocap on the clean bags with the /scan_nav of walker_laser_filter
    # (2026-10-28, 3 repetitions): the EKF's /odom has heading 2.03 deg and ATE 0.183 m (33 bags); the
    # scan matcher alone, 2.44 deg and 0.186 m (34 bags). Heading is the error left after removing a
    # constant bias. Tuned again with that recording (mocap_odometry/scripts/odom_tuning/tune.py): no
    # change of these covariances beats the noise of the evaluation.
    # With the earlier /scan_nav (the legs inside the scan), on 32 clean bags: heading 2.22 deg (scan
    # matcher alone) -> 1.91 deg, ATE 0.213 -> 0.208 m; worst bag +0.5 deg, most improve. Going weaker
    # still (R 0.2 / Q 1e-4) averaged 1.77 deg but its worst bag regressed +1.1 deg: it leans on the gyro.
    pose_covariance_diagonal:  [0.0025, 0.0025, 1.0e-6, 1.0e-6, 1.0e-6, 0.2]
    twist_covariance_diagonal: [0.01,   0.01,   1.0e-6, 1.0e-6, 1.0e-6, 0.02]

    # Laser params
    range_min: -10.0              # Minimum range of the scan_laser_sensor. If -10 it will acquire the value of the laser_scan_topic.
    range_max: -10.0              # Maximum range of the scan_laser_sensor. If -10 it will acquire the value of the laser_scan_topic.
    angle_min: -10.0              # Minimum angle of the scan_laser_sensor. If -10 it will acquire the value of the laser_scan_topic.
    range_samples_size: -10       # Number of samples of the scan_laser_sensor. If -10 it will acquire the value of the laser_scan_topic.
    angle_increment: -10.0        # Angle increment of the scan_laser_sensor. If -10 it will acquire the value of the laser_scan_topic.

    # CSM parameters - comments copied from algos.h (by Andrea Censi)
    max_angular_correction_deg: 45.0         # Maximum angular displacement between scans.
    max_linear_correction: 0.5               # Maximum translation between scans (m).
    max_iterations: 40                       # Maximum ICP cycle iterationsr.
    epsilon_xy: 0.000001                     # A threshold for stopping (m).
    epsilon_theta: 0.000001                  # A threshold for stopping (rad).
    max_correspondence_dist: 0.3             # Maximum distance for a correspondence to be valid.
    sigma: 0.010                             # Noise in the scan (m).
    use_corr_tricks: 1                       # Use smart tricks for finding correspondences.
    restart: 0                               # Restart if error is over threshold.
    restart_threshold_mean_error: 0.01       # Threshold for restarting.
    restart_dt: 1.0                          # Displacement for restarting. (m).
    restart_dtheta: 0.1                      # Displacement for restarting. (rad).
    clustering_threshold: 0.25               # Max distance for staying in the same clustering.
    orientation_neighbourhood: 20            # Number of neighbour rays used to estimate the orientation.
    use_point_to_line_distance: 1            # If 0, it's vanilla ICP.
    do_alpha_test: 0                         # Discard correspondences based on the angles.
    do_alpha_test_thresholdDeg: 20.0         # Discard correspondences based on the angles - threshold angle, in degrees.
    outliers_maxPerc: 0.9                    # Percentage of correspondences to consider: if 0.9, always discard the top 10% of correspondences with more error"
  
    # Parameters describing a simple adaptive algorithm for discarding.
    #  1) Order the errors.
    #  2) Choose the percentile according to outliers_adaptive_order.
    #     (if it is 0.7, get the 70% percentile)
    #  3) Define an adaptive threshold multiplying outliers_adaptive_mult
    #     with the value of the error at the chosen percentile.
    #  4) Discard correspondences over the threshold.
    #  This is useful to be conservative; yet remove the biggest errors.
    outliers_adaptive_order: 0.7
    outliers_adaptive_mult: 2.0

    # If you already have a guess of the solution, you can compute the polar angle
    # of the points of one scan in the new position. If the polar angle is not a monotone
    # function of the readings index, it means that the surface is not visible in the
    # next position. If it is not visible, then we don't use it for matching.
    do_visibility_test: 1
    outliers_remove_doubles: 1  # No two points in laser_sens can have the same corr
    do_compute_covariance: 0    # If 1, computes the covariance of ICP using the method http://purl.org/censi/2006/icpcov
    debug_verify_tricks: 0      # Checks that find_correspondences_tricks gives the right answer.
    use_ml_weights: 0           # If 1, the field 'true_alpha' (or 'alpha') in the first scan is used to 
                                # compute the incidence beta, and the factor (1/cos^2(beta)) used to weight the 
                                # correspondence.
    use_sigma_weights: 0        # If 1, the field 'readings_sigma' in the second scan is used to weight the correspondence by 1/sigma^2
    